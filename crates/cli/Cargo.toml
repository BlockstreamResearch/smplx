[package]
name = "smplx-cli"
version = "0.2.0"
description = "Simplex cli with various utilities to manage a simplicity project"
license.workspace = true
edition.workspace = true
repository = "https://github.com/BlockstreamResearch/smplx"
readme = "../../README.md"

[[bin]]
name = "simplex"
path = "src/bin/main.rs"

[lints]
workspace = true

[dependencies]
smplx-regtest = { workspace = true }
smplx-test = { workspace = true }
smplx-build = { workspace = true }
smplx-sdk = { workspace = true, features = ["provider"] }

thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
minreq = { workspace = true }

anyhow = "1.0.104"
dotenvy = "0.15.7"
clap = { version = "4.6.7", features = ["derive", "env"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
serde_json = { version = "1.0.154" }
