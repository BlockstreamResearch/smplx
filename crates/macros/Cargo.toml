[package]
name = "smplx-macros"
version = "0.2.0"
description = "Simplex macros re-export package"
license.workspace = true
edition.workspace = true
repository = "https://github.com/BlockstreamResearch/smplx"
readme = "../../README.md"

[lib]
proc-macro = true

[lints]
workspace = true

[features]
default = ["test"]
test = ["dep:smplx-test"]

[dependencies]
smplx-build = { workspace = true } 
smplx-test = { workspace = true, optional = true }

syn = { version = "3.0.8", default-features = false, features = ["parsing", "proc-macro"] }
