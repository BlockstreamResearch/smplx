[package]
name = "smplx-sdk"
version = "0.1.1"
description = "Simplex sdk to simplify the development with simplicity"
license.workspace = true
edition.workspace = true
repository = "https://github.com/BlockstreamResearch/smplx"
readme = "../../README.md"

[lints]
workspace = true

[features]
default = ["provider"]
provider = ["dep:minreq", "dep:bitcoincore-rpc"]

[dependencies]
thiserror = { workspace = true }
minreq = { workspace = true, optional = true }
simplicityhl = { workspace = true }
bitcoincore-rpc = { workspace = true, optional = true }
serde = { workspace = true }
hex = { workspace = true }

serde_json = { version = "1.0.154" }
elements-miniscript = { version = "0.5.0", features = ["base64", "serde"] }
bip39 = { version = "3.0.0", features = ["rand"] }
dyn-clone = { version = "1.0.20" }
