[package]
name = "smplx-sdk"
version = "0.0.8"
description = "Simplex sdk to simplify the development with simplicity"
license.workspace = true
edition.workspace = true
repository = "https://github.com/BlockstreamResearch/smplx"
readme = "../../README.md"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
sha2 = { workspace = true }
minreq = { workspace = true }
tempfile = { workspace = true }
simplicityhl = { workspace = true, features = ["serde"] }
bitcoincore-rpc = { workspace = true }
serde = { workspace = true }
hex = { workspace = true }

semver = { version = "1" }
serde_json = { version = "1.0" }
base64 = { version = "0.22" }
elements-miniscript = { version = "0.4", features = ["base64", "serde"] }
bip39 = { version = "2.0.0", features = ["rand"] }
dyn-clone = { version = "1.0.20" }
bitcoin_hashes = { version = "0.14.1" }
