[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["examples/basic", "fixtures"]

[workspace.package]
license = "MIT"
edition = "2024"

[workspace.dependencies]
smplx-macros = { path = "./crates/macros", version = "=0.2.0", default-features = false }
smplx-build = { path = "./crates/build", version = "=0.2.0" }
smplx-test = { path = "./crates/test", version = "=0.2.0" }
smplx-regtest = { path = "./crates/regtest", version = "=0.2.0" }
smplx-sdk = { path = "./crates/sdk", version = "=0.2.0", default-features = false }
smplx-std = { path = "./crates/simplex", version = "=0.2.0" }
smplx-wasm = { path = "./crates/wasm", version = "=0.2.0" }

rand_core = { version = "=0.10.1" }
rand = { version = "=0.10.3" }
serde = { version = "1.0.229", features = ["derive"] }
hex = { version = "0.4.3" }
hmac = { version = "0.13.0" }
sha2 = { version = "0.11.0" }
thiserror = { version = "2.0.21" }
toml = { version = "1.1.8" }
toml_edit = { version = "0.25.17" }
minreq = { version = "3.0.0", features = ["https", "json-using-serde"] }

electrsd = { version = "0.29.0", features = ["legacy"] }
bitcoincore-rpc = { version = "0.19.0" }

simplicityhl = { version = "0.8.0" }

[workspace.lints.rust]
rust_2018_idioms = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"
deprecated_in_future = "warn"

[workspace.lints.clippy]
multiple_crate_versions = "allow"
