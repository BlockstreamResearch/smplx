[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["examples/basic", "fixtures"]

[workspace.package]
license = "MIT"
edition = "2024"

[workspace.dependencies]
smplx-macros = { path = "./crates/macros", version = "0.0.8" }
smplx-build = { path = "./crates/build", version = "0.0.8" }
smplx-test = { path = "./crates/test", version = "0.0.8" }
smplx-regtest = { path = "./crates/regtest", version = "0.0.8" }
smplx-sdk = { path = "./crates/sdk", version = "0.0.8" }
smplx-std = { path = "./crates/simplex", version = "0.0.8" }

serde = { version = "1.0.228", features = ["derive"] }
hex = { version = "0.4.3" }
hmac = { version = "0.12.1" }
sha2 = { version = "0.10.9", features = ["compress"] }
thiserror = { version = "2.0.18" }
toml = { version = "0.9.8" }
toml_edit = { version = "0.25.12" }
minreq = { version = "3.0.0", features = ["https", "json-using-serde"] }

electrsd = { version = "0.29.0", features = ["legacy"] }
bitcoincore-rpc = { version = "0.19.0" }

# The SimplicityHL frontend Simplex links for version-stable work only (directive
# parsing, flattening, ABI typing); the funds-critical compile always goes through
# the pinned out-of-process `simc` (see `smplx_sdk::compiler`). Requires the
# versioned compiler APIs (`version` module, `witness_layout`); until they land in
# a published release, point this single line at the repository that carries them.
simplicityhl = { git = "https://github.com/Sdoba16/SimplicityHL", branch = "master" }

[workspace.lints.rust]
rust_2018_idioms = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"
deprecated_in_future = "warn"

[workspace.lints.clippy]
multiple_crate_versions = "allow"
